name: claim-receipts
version: "0.1.1"
description: "Evidence for agent sessions. Records the file changes and command invocations a session's hooks could observe, then reconciles the session's prose claims against that record. Four verdicts per claim: backed, unbacked, unverifiable, contradicted. Compares a claim with a capture; does not prove the claim true. Known limits in KNOWN_LIMITS.md. Local-only, no network, fail-open."
author: "Greg Welby and Hermes"
license: "MIT"
requires_hermes: ">=0.23.0"
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_end
capabilities:
  hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_end
  commands:
    - claim-receipts
  tools: []
  env: []
